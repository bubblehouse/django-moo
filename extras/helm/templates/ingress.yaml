{{- if .Values.ingress.enabled -}}
{{- $fullName := include "moo.fullname" . -}}
{{- /*
Mirrors extras/nginx/nginx.conf. Django serves the whole front end over HTTPS;
webssh contributes only its websocket (/ws) and the xterm.js assets the
terminal page loads from /static/. ingress-nginx applies backend-protocol to an
entire Ingress, so the two backends need an Ingress each. Both carry the same
hosts and TLS, and nginx merges them into one server block per host.
*/ -}}
{{- $routes := list
      (dict "name" $fullName
            "annotations" .Values.ingress.annotations
            "service" $fullName
            "port" .Values.service.port
            "paths" (list "/"))
      (dict "name" (printf "%s-webssh" $fullName)
            "annotations" .Values.ingress.webssh.annotations
            "service" (printf "%s-webssh" $fullName)
            "port" .Values.websshService.port
            "paths" (list "/ws" "/static")) }}
{{- range $routes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  labels:
    {{- include "moo.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $.Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  {{- $route := . }}
  rules:
    {{- range $.Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $route.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $route.service }}
                port:
                  number: {{ $route.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
