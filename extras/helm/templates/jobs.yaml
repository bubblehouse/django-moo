apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "moo.fullname" . }}-jobs
  labels:
    {{- include "moo.labels" . | nindent 4 }}
  annotations:
    {{- /* Migrations run BEFORE the upgrade rolls, not after. Helm waits for
           the Deployments to report Ready, and every one of them needs a
           schema: the webapp queries django_site on its probe URL and beat
           queries django_celery_beat_crontabschedule at startup. Against an
           empty database a post-upgrade hook can therefore never run -- the
           wait times out first, so the migration that would have unblocked
           the wait is exactly what the timeout prevents. Running it as
           pre-upgrade breaks that cycle, and is the right order for Django
           anyway. Install stays post-, because the postgres subchart does not
           exist yet when pre-install hooks fire; a first install still needs
           a reachable database and a manual moo_init. */}}
    helm.sh/hook: post-install,pre-upgrade
spec:
  template:
    metadata:
      annotations:
        {{- /* The Vault agent runs as a sidecar that never exits. In a Job pod
               that blocks completion forever, so the post-upgrade hook times
               out even when migrate and collectstatic both succeed.
               pre-populate-only injects just the init container, which still
               writes /vault/secrets/aws before the app containers start. */}}
        {{- $ann := merge (dict "vault.hashicorp.com/agent-pre-populate-only" "true") (.Values.podAnnotations | default dict) }}
        {{- toYaml $ann | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ include "moo.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: [manage.py, migrate, --no-input]
          env:
          - name: DJANGO_SETTINGS_MODULE
            value: {{ .Values.moo.django.settings }}
          - name: AWS_DEFAULT_REGION
            value: {{ .Values.moo.aws.region }}
          - name: AWS_STS_REGIONAL_ENDPOINTS
            value: regional
          {{- with .Values.env }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
        - name: collectstatic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: [manage.py, collectstatic, --no-input]
          env:
          - name: DJANGO_SETTINGS_MODULE
            value: {{ .Values.moo.django.settings }}
          - name: AWS_DEFAULT_REGION
            value: {{ .Values.moo.aws.region }}
          - name: AWS_STS_REGIONAL_ENDPOINTS
            value: regional
          {{- with .Values.env }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
