---
# Default values for moo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

moo:
  aws:
    region: us-east-2
  django:
    settings: moo.settings.dev

webssh:
  # SSH host webssh dials. Empty means this release's shell Service. Any name
  # set here must also be in the image's pregenerated_known_hosts.
  hostname: ''

valkey:
  enabled: true
  # Held at the old Bitnami service name so REDIS_HOSTNAME in the deployment
  # values keeps resolving without a matching change in the gitops repo.
  fullnameOverride: django-moo-redis-master
  architecture: standalone
  auth:
    enabled: false
  # Django cache plus the Celery broker. Neither needs to survive a restart,
  # and emptyDir avoids provisioning a hostPath PVC for it.
  persistence:
    enabled: false

postgres:
  enabled: false
  # Same reasoning as valkey above, for POSTGRES_HOSTNAME.
  fullnameOverride: django-moo-postgresql

replicaCount:
  webapp: 2
  webssh: 2
  worker: 2
  beat: 1
  shell: 2

image:
  repository: registry.gitlab.com/bubblehouse/django-moo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated
  # using the fullname template
  name: ''

# env:
#   - name: OTEL_TRACES_EXPORTER
#     value: "otlp"
#   - name: OTEL_EXPORTER_OTLP_ENDPOINT
#     value: "http://53971991.otel.gitlab-o11y.com:4318"
#   - name: OTEL_EXPORTER_OTLP_PROTOCOL
#     value: "http/protobuf"
#   - name: OTEL_SERVICE_NAME
#     value: "django-moo"

podAnnotations: {}

podSecurityContext:
  fsGroup: 33

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 33

service:
  type: ClusterIP
  port: 8443

sshService:
  type: ClusterIP
  port: 8022

websshService:
  type: ClusterIP
  port: 8422

# Paths are fixed by the template to match extras/nginx/nginx.conf: `/` goes to
# the Django webapp, `/ws` and `/static` to webssh. Only hosts are configurable.
ingress:
  enabled: false
  className: ''
  # Annotations for the webapp Ingress. uWSGI terminates TLS itself.
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  webssh:
    # Annotations for the webssh Ingress. webssh speaks plain HTTP, and the
    # read timeout matches nginx.conf so an idle terminal is not cut at 60s.
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
  hosts:
    - host: chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# We usually recommend not to specify default resources and to leave this as a
# conscious choice for the user. This also increases chances charts run on
# environments with little resources, such as Minikube. If you do want to
# specify resources, uncomment the following lines, adjust them as necessary,
# and remove the curly braces after 'resources:'.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
