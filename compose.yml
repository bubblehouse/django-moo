---
# A complete deployment of django-moo includes a number of containers. While the compose file
# covers everything needed for a typical deployment, the components can also be deployed in a
# more typically high-availability cloud environment.
services:
  # The `nginx` container provides trivial routing:
  #
  # * `/ws` (the terminal websocket) and `/static/` (the xterm.js assets) to `webssh`
  # * Everything else, including the terminal page and `/admin/`, to `webapp`
  # * Django's collected static assets (`/admin/static/`) straight from disk
  #
  # The Helm chart's two Ingresses reproduce the same split.
  #
  # In a fully productionalized deployment, this tier would likely be replaced with an S3 bucket
  # for static assets, and some kind of load balancer for routing.
  nginx:
    build:
      context: extras/nginx
      dockerfile: Dockerfile
    image: nginx:1.27.3-snakeoil
    volumes:
      - ./extras/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 443:443
    links:
      - webapp
  # The `webssh` container runs [webssh](https://github.com/huashengdun/webssh), which bridges the
  # browser terminal's websocket to the `shell` container. Django renders the terminal page and
  # proxies the connect POST; only the websocket and xterm.js assets are served from here.
  #
  # While it's not strictly necessary to use this interface, it provides access to users who may not
  # be able to connect over non-web ports.
  webssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: philchristensen/moo:latest
    user: www-data
    command: [webssh]
    # Reached only via nginx on the Docker network; not published to the host.
    expose:
      - 8422
    links:
      - shell
    environment:
      WEBSSH_HOSTNAME: shell
  # The `webapp` container is where the Django front-end runs: the terminal page, registration, and the admin.
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.gitlab.com/bubblehouse/django-moo:latest
    user: www-data
    # Reached only via nginx on the Docker network; not published to the host.
    expose:
      - 8443
    links:
      - postgres
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: moo.settings.local
      OTEL_SDK_DISABLED: 'true'
  # The `celery` container runs a single Celery worker, along with the Beat scheduler.
  # Note that in production, you'll want to run multiple workers for better performance,
  # and you'll want to run the scheduler separately.
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.gitlab.com/bubblehouse/django-moo:latest
    command: [celery]
    user: www-data
    links:
      - postgres
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: moo.settings.local
      OTEL_SDK_DISABLED: 'true'
  # The `shell` container runs the SSH server that displays the MOO interface.
  # As part of the Dockerfile we create pregenerate an SSH host file that's used
  # by the webssh container to restrict connections to this host.
  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.gitlab.com/bubblehouse/django-moo:latest
    command: [manage.py, moo_shell]
    user: www-data
    ports:
      - 8022:8022
    # 8023 is the internal healthcheck listener; not published to the host.
    expose:
      - 8023
    links:
      - postgres
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: moo.settings.local
      OTEL_SDK_DISABLED: 'true'
    healthcheck:
      test: [CMD-SHELL, nc -z localhost 8023 || exit 1]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  # The PostgreSQL database needs to define a moo user with an appropriate password.
  # This is a simple deployment, so we're not using a production-ready PostgreSQL container.
  postgres:
    image: postgres
    expose:
      - 5432
    environment:
      POSTGRES_PASSWORD: moo
      POSTGRES_USER: moo
      POSTGRES_DB: moo
    volumes:
      - moo_postgres_data:/var/lib/postgresql
  # Redis provides the queueing system Celery uses to run background tasks.
  # It also provides a cache for the Django application.
  redis:
    image: redis
    expose:
      - 6379

volumes:
  moo_postgres_data:
